name: lead-radar

services:
  api:
    build:
      context: ./lead-radar-backend
      dockerfile: Dockerfile
    image: lead-radar/backend:0.1.0
    command: ["/usr/local/bin/api"]
    env_file: [.env]
    environment:
      DATABASE_URL: sqlite:///data/lead-radar.db?mode=rwc
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - lead-radar-data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    image: lead-radar/backend:0.1.0
    command: ["/usr/local/bin/worker"]
    env_file: [.env]
    environment:
      DATABASE_URL: sqlite:///data/lead-radar.db?mode=rwc
    volumes:
      - lead-radar-data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./lead-radar-frontend
      dockerfile: Dockerfile
    image: lead-radar/frontend:0.1.0
    env_file: [.env]
    environment:
      API_INTERNAL_URL: http://api:8080
      PORT: "4321"
      HOST: 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-4321}:4321"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  lead-radar-data:
    name: lead-radar-data
