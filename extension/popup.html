<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lead Radar Reply</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body class="panel">
    <h1>Reply queue</h1>
    <p class="muted small">
      Open a thread: the panel appears on the page with the prepared reply. Nothing is posted for you.
    </p>
    <p id="followups" class="muted small" hidden></p>
    <ul id="queue" class="list"><li class="muted small">Loading…</li></ul>
    <div class="actions">
      <button id="refresh" type="button" class="secondary">Refresh</button>
      <a id="console" class="muted small" href="#" target="_blank" rel="noopener noreferrer">Open the queue</a>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
